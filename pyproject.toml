[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "elara"
version = "0.0.1"
description = "Environmental Learning and Adaptive Response Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.16,<3",
    "openai>=3.57,<4",
    "pydantic>=2.10,<3",
    "pydantic-ai>=1.107.10,<2",
    "pydantic-settings>=2.7,<3",
    "aiosqlite>=0.20,<1",
    "platformdirs>=4,<5",
    "psutil>=6,<8",
    "structlog>=25,<26",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pydantic-evals>=1,<2",
]

[project.scripts]
elara = "elara.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/elara"]
